
name: Java CI with Gradle

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    name: Build on
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v5
        with:
          java-version: "8"
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for Gradle wrapper
        if: runner.os == 'Linux'
        run: chmod +x gradlew

      - name: Build and test
        run: ./gradlew build
      
      - name: Prepare JAR for Docker
        run: |
          echo "Generated JAR files:"
          ls -la build/libs/
          JAR_FILE=$(find build/libs -maxdepth 1 -name "*.jar" ! -name "*-plain.jar" | head -n 1)
          test -n "$JAR_FILE" || (echo "No application JAR found" && exit 1)
          cp "$JAR_FILE" build/libs/app.jar

      - uses: mr-smithers-excellent/docker-build-push@v7
        name: Build & push Docker image
        with:
          image: ssssoham/cicd-practice
          tags: v1, latest
          registry: docker.io
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - run: echo "Build completed successfully; publish job ran."
